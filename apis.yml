aid: pair-eyewear
name: Pair Eyewear
description: >-
  Pair Eyewear is a direct-to-consumer eyewear brand known for its modular, magnetic Top Frames
  system: customers pick a base optical or sunglasses frame and swap interchangeable magnetic top
  frames in hundreds of patterns and licensed collaborations (Disney, Marvel, MLB, and more).
  Prescription and blue-light lenses are made and hand-assembled in California, with frames starting
  around $80, free shipping and 30-day returns, and a Pair+ membership. The paireyewear.com storefront
  runs on Shopify and exposes an agent-native commerce surface — a published agents.md and llms.txt,
  Shopify Customer Accounts OpenID Connect, and a live Universal Commerce Protocol (UCP) MCP endpoint
  for agent-driven catalog search, cart, and buyer-approved checkout.
